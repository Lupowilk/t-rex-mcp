name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: tar -czf t-rex-mcp-${{ matrix.target }}.tar.gz -C target/release t-rex-mcp

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: t-rex-mcp-${{ matrix.target }}.tar.gz
